<div align="center">
  <p><font size="+2">“ 该……了”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="780"　align="center">
  <tr>
    <td align="left">　中国語の“该……了”は日本語の「そろそろ～するころだ」や「そろそろ～の番だ」という意味であり、口語に多く用いられる。たとえば、 
  </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">你该休息了。 </font> 
                     <font size="3" face="sinsun">Nǐ gāi xiūxi le. </font>
                     <font size="3" face="ms-mincho">きみはそろそろ休むべきだよ。</font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">已经十点了，我该回家了。</font>
        <font size="3" face="sinsun">Yǐjīng shí diǎn le,wǒ gāi huí jiā le.  </font>
        <font size="3" face="ms-mincho">もう十時だ。そろそろ家へ帰る時間だ。 </font></td>
  </tr>
    <tr>
    <td><font size="4" face="sinsun">今天该你打扫房间了。 </font>
        <font size="3" face="sinsun">Jīntiān gāi nǐ dǎsǎo fángjiān le. </font>
        <font size="3" face="ms-mincho">今日そろそろ君が部屋を掃除する番だよ。 </font></td>
  </tr>
