    <td align="left">　中国語の“可以……吗”は、相手の許可や同意を得たいときに使われる。日本語の「〜をしてもいい」という意味である。たとえば、 
 </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">我可以问一个问题吗？ </font> 
                     <font size="3" face="sinsun">Wǒ kěyǐ wèn yígè wèntí ma？ </font>
                     <font size="3" face="mincho">ひとつ質問をしてもいい？ </font></td>
  </tr> 
  <tr>
    <td><font size="4" face="sinsun">我可以吃饭吗？ </font>
        <font size="3" face="sinsun">Wǒ kěyǐ chī fàn ma？ </font>
        <font size="3" face="mincho">ご飯を食べてもいい？ </font></td>
  </tr>
  
    <tr>
    <td><font size="4" face="sinsun">爸爸，我可以看电视吗？ </font>
        <font size="3" face="sinsun">Bàba, wǒ kěyǐ kàn diànshì ma？ </font>
