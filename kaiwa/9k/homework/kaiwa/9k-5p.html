<div align="center">
  <p><font size="+2">“ 快……了”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width=780" align="center">
  <tr>
    <td align="left">　中国語の“快……了”は日本語の「もうすぐ～」や「間もなく～」という意味である。“快……了”と似ている表現としては“快要……了”と“就要……了”が挙げられる。たとえば、  
  </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">六点了，爸爸快回来了。 </font> 
                     <font size="3" face="sinsun">Liù diǎn le, bàba kuài huí lái le. </font>
                     <font size="3" face="ms-mincho">六時だ。お父さんはもうすぐ帰ってくる。</font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">她快要毕业了吧？ </font>
        <font size="3" face="sinsun">Tā kuài yào bìyè le ba？ </font>
        <font size="3" face="ms-mincho">彼女はもうすぐ卒業するだろう。 </font></td>
  </tr>

    <tr>
    <td><font size="4" face="sinsun">台风就要来了。 </font>
        <font size="3" face="sinsun">Táifēng jiù yào lái le. </font>
        <font size="3" face="ms-mincho">台風がもうじき来る。 </font></td>
  </tr> <tr height="5"></tr>
