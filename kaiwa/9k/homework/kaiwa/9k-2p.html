<div align="center">
  <p><font size="+2">“ 够……的”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="950" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“够……的”という表現は日本語に訳すと「かなり～」や「十分～」という意味である。程度が高いことを表すときに使われる。否定のときは“不够……”となるので、決して“不够……的”ではないことに注意すべきである。たとえば、<br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">这个房间够大的。 </font>
                       <font size="3" face="sinsun">Zhè gè fángjiān gòu dà de. </font>
                              <font size="3" face="ms-mincho">この部屋は非常に広い。</font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">今天够累的。 </font>
                                     <font size="3" face="sinsun">Jīntiān gòu lèi de. 
 </font>
                                     <font size="3" face="ms-mincho">今日は本当に疲れた。</font> </td>
  </tr>
   <tr>
    <td><font size="4" face="sinsun">这个房间不够大。 </font>
        <font size="3" face="sinsun">Zhè gè fángjiān bú gòu dà. </font>
        <font size="3" face="ms-mincho">この部屋は十分な広さはない。 </font></td>
  </tr>
