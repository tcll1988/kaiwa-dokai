<div align="center">
  <p><font size="+2">“什么”と“谁”の使い方 </font> </p>
  <p><br />
  </p>
</div>
<table width="500" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“什么”と“谁”のいずれも疑問代名詞である。疑問代名詞を用いた疑問文は、文末に疑問を表わす疑問終助詞である“吗”を入れないことに注意すべきである。たとえば､  
  
       <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left">
    <font size="4" face="sinsun">那是什么？ </font>
    <font size="3" face="sinsun">Nà shì shénme？ </font>
    <font size="3" face="ms-mincho">それは何なの？ </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">她是谁？ </font>
                                     <font size="3" face="sinsun">Tā shì shéi？  </font>
                                     <font size="3" face="ms-mincho">彼女は誰？ </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">那是什么书？ </font>
        <font size="3" face="sinsun">Nà shì shénme shū？ </font>
        <font size="3" face="ms-mincho">それは何の本？ </font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">这是谁的书？ </font>
        <font size="3" face="sinsun">Zhè shì shéi de shū？  </font>
        <font size="3" face="ms-mincho">これは誰の本なの？  </font> </td>
  </tr>
