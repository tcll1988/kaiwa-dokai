<table width="500" align="center">

    <td align="left" bgcolor＝"#03F";>　中国語の“吧”は終助詞であり、推量などに使われる。日本語の「～だろう」という意味である。たとえば、 
       <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">她是学生吧。 </font>
                              <font size="3" face="sinsun">Tā shì xuésheng ba. </font>
                              <font size="3" face="ms-mincho">彼女は学生だろう。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">你是老师吧。 </font>
                                     <font size="3" face="sinsun">Nǐ shì lǎoshī ba. </font>
                                     <font size="3" face="ms-mincho">貴方は先生でしょう。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">她大概来吧。 </font>
        <font size="3" face="sinsun">Tā dàgài lái ba. </font>
        <font size="3" face="ms-mincho">彼女は多分来るだろう。 </font></td>
  </tr>
