    <td align="left" bgcolor＝"#03F";>　第三課では、推量の意味に使われる“吧”について説明した。この課に出ている“吧”は勧誘や要求、または命令のときに使われるものである。たとえば、  
         <br />
          <br />
    </td>

      <tr>
    <td align="left"><font size="4" face="sinsun">你六点半来吧。 </font>
                     <font size="3" face="sinsun">Nǐ liù diǎn bàn lái ba. </font>                    
                     <font size="3" face="ms-mincho">六時半に来なさい。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">再吃一碗吧。 </font>
        <font size="3" face="sinsun">Zài chī yì wǎn ba. </font>
        <font size="3" face="ms-mincho">もう一杯食べたらどうですか。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">现在五点了，快走吧。 </font>
        <font size="3" face="sinsun">Xiànzài wǔ diǎn le, kuài zǒu ba. </font>
        <font size="3" face="ms-mincho">今もう五時なので、急いで歩こう。 </font></td>
