  <p><font size="+2">“还是……吧”の使い方 </font> </p>
  <p><br />
  </p>
</div>
<table width="920" align="center">
  <tr>
    <td align="left">　中国語の“还是……吧”はいろいろと比較した結果、「やはり～したほうがいい」というときに使われる。たとえば、 
 </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">还是后天去吧。</font> 
                     <font size="3" face="sinsun">Háishi hòutiān qù ba. </font>
<font size="3" face="ms-mincho">やはり明後日に行こう。 </font></td></tr>
 <tr>
       <td align="left"><font size="4" face="sinsun">我唱得不好，还是你唱吧。 </font> 
                     <font size="3" face="sinsun">Wǒ chàngde bùhǎo,háishi nǐ chàngba. </font>
<font size="3" face="ms-mincho"> 私は歌が下手だから、やはりあなたが歌ったほうがいいよ。 </font></td></tr>
<tr>
    <td align="left"><font size="4" face="sinsun">还是你翻译吧，我不行。</font> 
                     <font size="3" face="sinsun">Háishi nǐ fānyì ba,wǒ bù xíng. </font>
<font size="3" face="ms-mincho">君が通訳したほうがいい。私はだめだ。 </font></td></tr>
