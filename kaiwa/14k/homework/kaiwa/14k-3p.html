<div align="center">
  <p><font size="+2">“这就……”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="780" align="center">
  <tr>
    <td align="left">　この表現の中の“这”は話し言葉で、「これ」という意味ではなく、「今から」という意味である。“这就……”は日本語の「今からすぐ」という意味で、日常会話によく使われる表現である。たとえば、 
 </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">她这就来。 </font> 
                     <font size="3" face="sinsun">Tā zhè jiù lái. </font>
<font size="3" face="ms-mincho">彼女は今からすぐ来るよ。</font></td></tr>
 <tr>
       <td align="left"><font size="4" face="sinsun">这就睡，这就睡。 </font> 
                     <font size="3" face="sinsun">Zhè jiù shuì,zhè jiù shuì. </font>
<font size="3" face="ms-mincho">今からすぐ寝るよ。 </font></td></tr>
<tr>
    <td align="left"><font size="4" face="sinsun"> 你别出去了，饭这就好了。</font> 
                     <font size="3" face="sinsun">Nǐ bié chūqù le,fàn zhè jiù hǎo le.  </font>
<font size="3" face="ms-mincho">もう出かけないで、ご飯はすぐにできるよ。 </font></td></tr>
