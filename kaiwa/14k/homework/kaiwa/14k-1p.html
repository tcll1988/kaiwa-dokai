<div align="center">
  <p><font size="+2">“喂，……”の使い方 </font> </p>
  <p><br />
  </p>
</div>
<table width="680" align="center">
  <tr>
    <td align="left">　中国語の“喂”は感嘆詞であり、日本語の「おい」や「もしもし」という意味である。主として、人を呼びかけるときや電話のときに使われる。電話をするときの“喂”は“wèi”ではなく、“wéi”と発音する。たとえば、    
 </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">喂，你去哪儿？ </font> 
                     <font size="3" face="sinsun">Wèi,nǐ qù nǎr？ </font>
                     <font size="3" face="mincho">おい、どこへ行くんだい？ </font></td>
  </tr> 
  <tr>
    <td><font size="4" face="sinsun">喂，一起去吃饭好吗？ </font>
        <font size="3" face="sinsun">Wèi,yìqǐ qù chī fàn hǎo ma？ </font>
        <font size="3" face="mincho">ねぇ、一緒にご飯を食べに行かない？ </font></td>
  </tr>
  
    <tr>
    <td><font size="4" face="sinsun">喂，请转442分机。 </font>
        <font size="3" face="sinsun">Wéi,qǐng zhuǎn sì sì èr fēnjī. </font>
        <font size="3" face="mincho">もしもし、内線の442番にお願いします。 </font></td>
  </tr>
