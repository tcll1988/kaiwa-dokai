  <p><font size="+2">“去＋動詞”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="800" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“去＋動詞”は日本語の「～しに行く」という意味である。もし「～へ～しに行く」という意味であれば、場所を表わす名詞を必ず“去”の後に入れる。たとえば、   
         <br />
          <br />
    </td>
  </tr>
   <tr>
    <td align="left">
    <font size="4" face="sinsun">她昨天去打工了。 </font>
    <font size="3" face="sinsun">Tā zuótiān qù dǎ gōng le. </font>
    <font size="3" face="ms-mincho">彼女は昨日バイトに行った。</font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">我去图书馆看书。 </font>
                                     <font size="3" face="sinsun">Wǒ qù túshūguǎn kàn shū. </font>
                                     <font size="3" face="ms-mincho">私は図書館へ本を読みに行く。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">明天我们去公园玩儿。 </font>
        <font size="3" face="sinsun">Míngtiān wǒmen qù gōngyuán wánr. </font>
        <font size="3" face="ms-mincho">明日私たちは公園へ遊びに行く。</font></td>
  </tr>
