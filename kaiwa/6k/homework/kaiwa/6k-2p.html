    <td align="left" bgcolor＝"#03F";>　この表現に使われている“挺”は日本語に訳されると、「とても」や「なかなか」という意味である。“挺”を使うときは文末に常に“的”で呼応する。たとえば、 
         <br />
          <br />

  </tr>
  <tr>
    <td><font size="4" face="sinsun">这个公园挺大的。 </font>

  </tr>
