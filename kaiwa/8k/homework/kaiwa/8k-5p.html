<div align="center">
  <p><font size="+2">“一点儿”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="580" align="center">
  <tr>
    <td align="left">　ここの“一点儿”は日本語に訳されると「すこし」や「ちょっと」という意味である。通常述語の後に入れる。書くときは“儿”が省略されることもあるが、会話のときは基本的に省略されない。たとえば、
 </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">他会说一点儿英文。</font> 
                     <font size="3" face="sinsun">Tā huì shuō yìdiǎnr Yīngwén.</font>
                     <font size="3" face="ms-mincho">彼はすこし英語が話せる。</font></td>
  </tr> <tr height="5"></tr>
  <tr>
    <td><font size="4" face="sinsun">我吃一点儿。</font>
        <font size="3" face="sinsun">Wǒ chī yìdiǎnr.</font>
        <font size="3" face="ms-mincho">私はすこし食べる。 </font></td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td><font size="4" face="sinsun">我学了一点儿中文。</font>
        <font size="3" face="sinsun">Wǒ xué le yìdiǎnr Zhōngwén.</font>
        <font size="3" face="ms-mincho">私はすこし中国語を勉強した。</font></td>
  </tr> <tr height="5"></tr>
