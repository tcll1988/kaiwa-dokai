<div align="center">
  <p><font size="+2">“在＋動詞”について</font> </p>
  <p><br />
  </p>
</div>
<table width="580" align="center">
  <tr>
    <td align="left">　中国語の“在”は動詞の前に置かれると、動作が進行中であることを意味している。この場合、文末によく“呢”を入れる。ここで注意すべきことは同じ短文の中に、場所を表わす“在”と動作の進行形を表わす“在”が同時に出現するとき、場所の前に“在”をひとつ入れるだけでよいことである。たとえば、
 </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">他在写信。</font> 
                     <font size="3" face="sinsun">Tā zài xiě xìn.</font>
                     <font size="3" face="mincho">彼は手紙を書いている。</font></td>
  </tr> <tr height="5"></tr>
  <tr>
    <td><font size="4" face="sinsun">他在看书呢。</font>
        <font size="3" face="sinsun">Tā zài kàn shū ne.</font>
        <font size="3" face="mincho">彼は本を読んでいる。 </font></td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td><font size="4" face="sinsun">他在图书馆看书呢。</font>
        <font size="3" face="sinsun">Tā zài túshūguǎn kàn shū ne.</font>
        <font size="3" face="mincho">彼は図書館で本を読んでいる。</font></td>
  </tr> <tr height="5"></tr>
