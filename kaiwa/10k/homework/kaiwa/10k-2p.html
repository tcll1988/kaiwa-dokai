<table width="950" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“既……又……”は日本語の「～であるし、～でもある」
という意味や「～するし、～もする」という意味である。たとえば、<br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">饺子既便宜又好吃。</font>
                       <font size="3" face="sinsun">Jiǎozi jì piányi yòu hǎochī. </font>
                              <font size="3" face="ms-mincho">餃子は安いし、またおいしい。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">他既会中文又会英文。  </font>
                                     <font size="3" face="sinsun">Tā jì huì Zhōngwén yòu huì Yīngwén. 
 </font>
                                     <font size="3" face="ms-mincho">彼は中国語もできるし、英語もできる。 </font> </td>
  </tr>
   <tr>
    <td><font size="4" face="sinsun">我既去上海又去北京。 </font>
        <font size="3" face="sinsun">Wǒ jì qù Shànghǎi yòu qù Běijīng. </font>
        <font size="3" face="ms-mincho">私は上海にも行くし、北京にも行く。 </font></td>
  </tr>
