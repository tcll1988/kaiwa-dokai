<div align="center">
  <p><font size="+2">“喜欢……”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="700" align="center">
  <tr>
    <td align="left">　中国語の“喜欢……”は日本語の「～が好きである」という意味である。この表現を使うとき、好きである内容を“喜欢”の後に入れればよい。たとえば、 
     </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">我喜欢音乐。 </font> 
                     <font size="3" face="sinsun">Wǒ xǐhuan yīnyuè. </font>
                     <font size="3" face="ms-mincho">私は音楽が好きだ。</font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">我喜欢做饭。 </font>
        <font size="3" face="sinsun">Wǒ xǐhuan zuò fàn.  </font>
        <font size="3" face="ms-mincho">私はご飯を作るのが好きだ。 </font></td>
  </tr>

    <tr>
    <td><font size="4" face="sinsun">我喜欢冬天去滑雪。 </font>
        <font size="3" face="sinsun">Wǒ xǐhuan dōngtiān qù huá xuě. </font>
        <font size="3" face="ms-mincho">私は冬にスキーに行くのが好きだ。 </font></td>
  </tr>
