<div align="center">
  <p><font size="+2">中国語の“其实”について</font> </p>
  <p><br />
  </p>
</div>
<table width="950" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“其实”は本音を言うときに使う表現である。日本語に訳すと「実は〜」という意味であり、表の現象と違うニュアンスが含まれる。たとえば、 
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">其实她人很好。 </font>
                       <font size="3" face="sinsun">Qíshí tā rén hěn hǎo. </font>
                              <font size="3" face="ms-mincho">実は、彼女はとてもいい人だ。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">其实这本小说不难。  </font>
                                     <font size="3" face="sinsun">Qíshí zhè běn xiǎoshuō bù nán. 
 </font>
                                     <font size="3" face="ms-mincho">実は、この小説は難しくない。 
</font> </td>
  </tr>
   <tr>
    <td><font size="4" face="sinsun">其实我家离学校不远。  </font>
        <font size="3" face="sinsun">Qíshí wǒjiā lí xuéxiào bùyuǎn. </font>
        <font size="3" face="ms-mincho">実は、家は学校から遠くない。 </font></td>
  </tr>
