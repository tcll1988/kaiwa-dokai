<div align="center">
  <p><font size="+2">“怕……”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width=780" align="center">
  <tr>
    <td align="left">　中国語の“怕”はもともと日本語の「恐れる」や「怖い」という意味である。ここで紹介する“怕……”は苦手のときに使われるもので、日本語に訳すと「～に弱い」という意味である。たとえば、   
  </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">我怕坐船。 </font> 
                     <font size="3" face="sinsun">Wǒ pà zuò chuán. </font>
                     <font size="3" face="ms-mincho">私は船に弱い。 </font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">这种布怕用水洗。 </font>
        <font size="3" face="sinsun">Zhè zhǒng bù pà yòng shuǐ xǐ. </font>
        <font size="3" face="ms-mincho">この生地は水に弱い。 </font></td>
  </tr>
    <tr>
    <td><font size="4" face="sinsun">我怕高。 </font>
        <font size="3" face="sinsun">Wǒ pà gāo. </font>
        <font size="3" face="ms-mincho">私は高いところがだめだ。 </font></td>
  </tr>
