<div align="center">
  <p><font size="+2">“ 受身表現”について</font> </p>
  <p><br />
  </p>
</div>
<table width="700" align="center">
  <tr>
    <td align="left">　中国語の“被……”は中国語の受け身表現に使われ、日本語の「～に～（ら）れる」という意味に相当する。“被”の後に来るものは人でもよく、ものでもよい。また動作主は省略されるときもある。たとえば、
     </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">我被老师批评了。 </font> 
                     <font size="3" face="sinsun">Wǒ bèi lǎoshī pīpíng le. </font>
                     <font size="3" face="ms-mincho">私は先生に叱られた。 </font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">小李回家时被雨淋了。 </font>
        <font size="3" face="sinsun">Xiǎo Lǐ huíjiā shí bèi yǔ lín le. </font>
        <font size="3" face="ms-mincho">李さんは家へ帰るとき雨に降られた。 </font></td>
  </tr>

    <tr>
    <td><font size="4" face="sinsun">我被打了一针。 </font>
        <font size="3" face="sinsun">Wǒ bèi dǎ le yì zhēn. </font>
        <font size="3" face="ms-mincho">私は一本注射を受けた。 </font></td>
  </tr>
