<div align="center">
  <p><font size="+2">“可能”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="950" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“可能”は副詞として使われ、日本語の「多分」や「～かもしれない」という意味である。日本語の「可能」という意味ではないことに注意すべきである。たとえば、 <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">可能要下雨吧。 </font>
                       <font size="3" face="sinsun">Kěnéng yào xià yǔ ba. </font>
                              <font size="3" face="ms-mincho">たぶん雨が降るだろう。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">可能他不来吧。 </font>
                                     <font size="3" face="sinsun">Kěnéng tā bù lái ba. 
 </font>
                                     <font size="3" face="ms-mincho">恐らく彼は来ないだろう。 </font> </td>
  </tr>
   <tr>
    <td><font size="4" face="sinsun">可能他感冒了。 </font>
        <font size="3" face="sinsun">Kěnéng tā gǎnmào le.</font>
        <font size="3" face="ms-mincho">彼は風邪を引いたかもしれない。 </font></td>
  </tr>
