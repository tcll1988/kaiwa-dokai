<div align="center">
  <p><font size="+2">“ 刚……”の使い方</font> </p>
  <p><br />
  </p>
</div>
<table width="680" align="center">
  <tr>
    <td align="left">　中国語の“刚……”は日本語の「～をしたばかり」の意味に使われる。“刚才”と違って独立して使うことはできない。“刚”の後ろに必ず動詞が必要である。 “刚……”を使うと、過去であっても“了”を使わないことに注意すべきである。たとえば、  
 </td>
  </tr>
  <tr height="5"></tr>
    <tr>
    <td align="left"><font size="4" face="sinsun">他刚来日本。 </font> 
                     <font size="3" face="sinsun">Tā gāng lái Rìběn. </font>
                     <font size="3" face="mincho">彼は日本に来たばかりだ。 </font></td>
  </tr> 
  <tr>
    <td><font size="4" face="sinsun">我刚学中文。   </font>
        <font size="3" face="sinsun">Wǒ gāng xué Zhōngwén. </font>
        <font size="3" face="mincho">私は中国語を習ったばかりだ。 </font></td>
  </tr>
  
    <tr>
    <td><font size="4" face="sinsun">小王刚走。 </font>
        <font size="3" face="sinsun">Xiǎo Wáng gāng zǒu. </font>
        <font size="3" face="mincho">王さんは出かけたばかりだ。 </font></td>
  </tr>
