<div align="center">
  <p><font size="+2">“请问……”の使い方</font> </p>
  <p><br />
  </p>

<table width="800" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“请问……”は何かを尋ねるときに使われる。日本語の「ちょっと伺いますが～」という意味である。丁寧な表現である。たとえば、 
        <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">请问，您贵姓？</font>
                              <font size="3" face="sinsun">Qǐng wèn,nín guìxìng？ </font>
                              <font size="3" face="ms-mincho">ちょっと伺いますが、何とおっしゃいますか。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">请问，明天您来吗？ </font>
                                     <font size="3" face="sinsun">Qǐng wèn,míngtiān nín lái ma？ </font>
                                     <font size="3" face="ms-mincho">ちょっと伺いますが、明日来てくださいますか。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">请问，她叫什么名字？ </font>
        <font size="3" face="sinsun"> Qǐng wèn,tā jiào shénme míngzi？ </font>
        <font size="3" face="ms-mincho">ちょっと伺いますが、彼女は何という名前ですか。 </font></td>
  </tr>
