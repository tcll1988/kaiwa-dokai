  <p><font size="+2">“太……了”の使い方</font> </p>
  <p><br />
  </p>

<table width="600" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“太……了”は日本語の｢とっても｣という意味である。口語によく使われる表現であり、“太”と“了”の間に入るものは通常形容詞である。たとえば、 
        <br />
          <br />
    </td>
  </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">今天太热了。 </font>
  <font size="3" face="sinsun">Jīntiān tài rè le. </font>
  <font size="3" face="ms-mincho">今日は暑過ぎる。</font> 
 </td>
 </tr>
        <tr>
  <td>
  <font size="4" face="sinsun">南京的夏天太热了。 </font>
  <font size="3" face="sinsun">Nánjīng de xiàtiān tài rè le. </font>
  <font size="3" face="ms-mincho">南京の夏はとっても暑い。 </font> 
 </td>
 </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">他的中文太好了。</font>
  <font size="3" face="sinsun">Tā de Zhōngwén tài hǎo le. </font>
  <font size="3" face="ms-mincho">彼の中国語はとってもすばらしい。 </font> 
 </td>
 </tr>
