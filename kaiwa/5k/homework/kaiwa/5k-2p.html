  </p>

<table width="600" align="center">
<tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“不太……”は日本語の「あまり～ない」という意味である。口語によく使われる表現である。たとえば、   
         <br />
          <br />
    </td>
  </tr>
    <tr>
    <td align="left">
    <font size="4" face="sinsun">我的中文不太好。 </font>
    <font size="3" face="sinsun">Wǒ de Zhōngwén bú tài hǎo. </font>
    <font size="3" face="ms-mincho">私の中国語はあまりよくない。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">南京的夏天不太热。</font>
                                     <font size="3" face="sinsun">Nánjīng de xiàtiān bú tài rè. </font>
                                     <font size="3" face="ms-mincho">南京の夏はあまり暑くない。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">中文不太难。</font>
        <font size="3" face="sinsun">Zhōngwén bú tài nán. </font>
        <font size="3" face="ms-mincho">中国語はあまり難しくない。 </font></td>
  </tr>
