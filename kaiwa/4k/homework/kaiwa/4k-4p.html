<table width="500" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の曜日の言い方は下記の通りである。  
       <br />
          <br />
    </td>
  </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">星期一 </font>
  <font size="3" face="sinsun">xīngqīyī</font>
  <font size="3" face="ms-mincho">月曜日</font> 
 </td>
 </tr>
  
      <tr>
  <td>
  <font size="4" face="sinsun">星期二</font>
  <font size="3" face="sinsun">xīngqī'èr</font>
  <font size="3" face="ms-mincho">火曜日</font> 
 </td>
 </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">星期三</font>
  <font size="3" face="sinsun">xīngqīsān</font>
  <font size="3" face="ms-mincho">水曜日</font> 
 </td>
 </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">星期四</font>
  <font size="3" face="sinsun">xīngqīsì</font>
  <font size="3" face="ms-mincho">木曜日</font> 
 </td>
 </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">星期五</font>
  <font size="3" face="sinsun">xīngqīwǔ</font>
  <font size="3" face="ms-mincho">金曜日</font> 
 </td>
 </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">星期六</font>
  <font size="3" face="sinsun">xīngqīliù</font>
  <font size="3" face="ms-mincho">土曜日</font> 
 </td>
 </tr>
  <tr>
  <td>
  <font size="4" face="sinsun">星期天（日）</font>
  <font size="3" face="sinsun">xīngqītiān（rì）</font>
  <font size="3" face="ms-mincho">日曜日</font> 
 </td>
 </tr>
