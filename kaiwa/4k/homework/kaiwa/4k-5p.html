<div align="center">
  <p><font size="+2">“呢”の使い方①</font> </p>
  <p><br />
  </p>
</div>
<table width="600" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　中国語の“呢”は終助詞であるので、文末に入る。疑問以外の意味にも使われるが、ここでは主として疑問を表わすときの使い方について説明する。たとえば、 
       <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">我喜欢她，你呢？ </font>
                              <font size="3" face="sinsun">Wǒ xǐhuan tā,nǐ ne？</font>
                              <font size="3" face="ms-mincho">私は彼女が好きだが、あなたは？</font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">我的词典呢？ </font>
                                     <font size="3" face="sinsun">Wǒ de cídiǎn ne？ </font>
                                     <font size="3" face="ms-mincho">私の辞書は？ </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">她是谁呢？ </font>
        <font size="3" face="sinsun">Tā shì shéi ne？ </font>
        <font size="3" face="ms-mincho">彼女は誰だろうか。 </font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">明天去哪儿呢？ </font>
        <font size="3" face="sinsun">Míngtiān qù nǎr ne？ </font>
        <font size="3" face="ms-mincho">明日どこへ行こうか。 </font></td>
  </tr>
