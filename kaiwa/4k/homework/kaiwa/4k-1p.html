<table width="600" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　動詞が述語となっている文は「動詞述語文」という。動詞述語文では動詞の後に目的語がある場合には、動詞と目的語の構文順序が中国語と日本語とで異なっている。日本語では目的語の後に動詞を入れるのに対し、中国語では目的語の前に動詞を入れる。たとえば、  
         <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left">
    <font size="4" face="sinsun">我们学习中文。 </font>
    <font size="3" face="sinsun">Wǒmen xuéxí Zhōngwén. </font>
    <font size="3" face="ms-mincho">私達は中国語を勉強する。 </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">明天我不来学校。 </font>
                                     <font size="3" face="sinsun">Míngtiān wǒ bù lái xuéxiào. </font>
                                     <font size="3" face="ms-mincho">明日私は学校に来ない。 </font> </td>
  </tr>
 
  <tr>
    <td><font size="4" face="sinsun">老师现在做什么？ </font>
        <font size="3" face="sinsun">Lǎoshī xiànzài zuò shénme? </font>
        <font size="3" face="ms-mincho">先生は今何をしていますか。  </font></td>
  </tr>
