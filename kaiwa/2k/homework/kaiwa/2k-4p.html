<div align="center">
  <p><font size="+2">“几”と“多少”の使い方 </font> </p>
  <p><br />
  </p>
</div>
<table width="500" align="center">
  <tr>
    <td align="left" bgcolor＝"#03F";>　“几”は普通 10 以下の数を問うときに使われ、それ以上の数を問う場合には“多少”は使われる。いずれも数を聞くための表現である。たとえば、 
       <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left"><font size="4" face="sinsun">今天几号？ </font>
                              <font size="3" face="sinsun">Jīntiān jǐ hào？ </font>
                              <font size="3" face="ms-mincho">今日は何日なの？ </font> </td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">今天八号。 </font>
                                     <font size="3" face="sinsun">Jīntiān bā hào. </font>
                                     <font size="3" face="ms-mincho">今日は八日だ。 </font> </td>
  </tr>

  <tr>
    <td><font size="4" face="sinsun">今天多少号？ </font>
        <font size="3" face="sinsun">Jīntiān duōshǎo hào？ </font>
        <font size="3" face="ms-mincho">今日は何日なの？ </font></td>
  </tr>
  <tr>
    <td><font size="4" face="sinsun">今天二十九号。 </font>
        <font size="3" face="sinsun">Jīntiān èrshíjiǔ hào. </font>
        <font size="3" face="ms-mincho">今日は二十九日だ。 </font> </td>
  </tr>
