<div align="center">
  <p><font size="+2">年齢の言い方 </font> </p>
  <p><br />
  </p>
</div>
<table width="700" align="center">
  <tr>
    <td align="left">　中国では年齢を聞くときは、主として下記の３通りの言い方がある。たとえば、 
 </td>
  </tr>
     <tr height="5"></tr>
    <tr>
    <td><strong>①子どもに聞くとき</strong></td>
  </tr>
  <tr>
  <tr height="5"></tr>
    <td><font size="4" face="sinsun">你几岁了？ </font>
     <font size="3" face="sinsun">Nǐ jǐ suì le？ </font>
     <font size="3" face="ms-mincho">何歳なの？  </font></td>
  </tr>
    <tr>
    <td><font size="4" face="sinsun">三岁。 </font>
    <font size="3" face="sinsun">Sān suì. </font>
    <font size="3" face="ms-mincho">３歳。 </font></td>
  </tr>
    <tr height="5"></tr>
  <tr>
    <td align="left"><strong>②一般的な人に聞くとき</strong></td>
  </tr>
  <tr height="5"></tr>
 <tr>
    <td>
     <font size="4" face="sinsun">你多大了？ </font>	
      <font size="3" face="sinsun">Nǐ duō dà le. </font>
      <font size="3" face="ms-mincho">おいくつですか。  </font></td>
  </tr>
   <tr>
    <td><font size="4" face="sinsun">三十岁。 </font>
    <font size="3" face="sinsun">Sānshí suì. </font>
    <font size="3" face="ms-mincho">30 歳です。 </font></td>
  </tr>
    <tr height="5"></tr>
  <tr>
    <td align="left"><strong>③お年寄りの人に聞くとき</strong></td>
  </tr>
  <tr height="5"></tr>
 <tr>
    <td>
     <font size="4" face="sinsun">您多大岁数了？ </font>	
      <font size="3" face="sinsun">Nín duō dà suì shu le？ </font>
      <font size="3" face="ms-mincho">お年はおいくつですか。 </font></td>
  </tr>
   <tr>
    <td><font size="4" face="sinsun">八十六岁了。 </font>
    <font size="3" face="sinsun">Bāshíliùsuì le. </font>
    <font size="3" face="ms-mincho">もう 86 歳です。 </font></td>
  </tr>
