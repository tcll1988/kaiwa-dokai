<div align="center">
  <p><font size="+2"><strong>“再……”の使い方</strong></font> </p>
  <p><br />
  </p>
</div>
<table width="500" align="center">
  <tr>
    <td align="left">　ここの“再……”は日本語の「再び」という意味ではなく、「もっと」「もうすこし」などの意味である。この“再……”は、よく“一点儿”“一会儿”“ 一遍”などと呼応して使われる。たとえば、 
 </td>
  </tr>
  <tr height="5"></tr>
 
  <tr>
    <td align="left">
      <font size="4" face="sinsun">再吃一点儿。</font>
      <font size="3" face="sinsun">Zài chī yìdiǎnr. </font>
      <font size="3" face="mincho">もうちょっと食べてください。</font></td>
  </tr>
  <tr>
    <td align="left">
      <font size="4" face="sinsun">再说一遍。</font>
      <font size="3" face="sinsun">Zài shuō yíbiàn. </font>
      <font size="3" face="mincho">もう一度言ってください。
 </font></td>
  </tr>
  <tr>
    <td align="left">
      <font size="4" face="sinsun">再喝一杯。 </font>
      <font size="3" face="sinsun">Zài hē yìbēi. </font>
      <font size="3" face="mincho">もう一杯飲んでください。
 </font></td>
  </tr>
   <tr>
    <td align="left">
      <font size="4" face="sinsun">再坐一会儿。 </font>
      <font size="3" face="sinsun">Zài zuò yíhuìr. </font>
      <font size="3" face="mincho">もうちょっと座ってください。 </font></td>
  </tr>
