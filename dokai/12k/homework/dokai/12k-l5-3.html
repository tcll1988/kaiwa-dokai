<table border="1" style="font-size:30px;"  align="center">
 <tr>
 <td colspan="5" width="300"> <font size="5" face="simsun">　我来日本快要四年了，可还没有完全习惯日本的生活。因为日本人说话不直接，有时不能理解他们想说什么。我去过法国和德国，在法国生活了一年多，在德国生活了两年，都比在日本生活的时间短，但我很快就习惯了那儿的生活。因为那里的人说话很直接，和中国人一样。但我喜欢日本，喜欢日本人。因为我觉得日本人很有礼貌。</font>  </td>
 </tr>
  <tr>
  <td width="47">
 <font size="5"></font>
  </td>
  <td colspan="4"> <font size="5">我在西方一共生活了几年？ </font>  </td>
  </tr>
