 <td colspan="5" width="300"> <font size="5" face="simsun">　上小学时，我喜欢文艺。我学过唱歌儿，学过跳舞，还学过弹钢琴。 从小学一年级开始学唱歌儿一直到小学结束。从小学二年级开始学跳舞一直到高中三年级结束。钢琴也是从小学一年级开始学的，但现在一直还坚持弹钢琴。
 <br /> 　从高中一年级开始，每年我都参加全国钢琴比赛，得过三次全国第一名。今年是我大学的最后一年，也是最后一次参加全国钢琴比赛，我希望能得第一名。 </font>  </td>
 </tr>
