 <tr>
 <td colspan="5" width="300"> <font size="5">今天是星期六，明天就要到八月了。三月底从家出来上大学，一次 也没回过家。我很想家里人，想爸爸和妈妈，想爷爷，想哥哥和姐姐。 开始学中文时，觉得中文一点儿也没有意思，可后来觉得中文越学越有 意思。我现在很喜欢学中文。明天我就要回家了，我想告诉家里人我的 大学生活。 </font>  </td>
 </tr>
  <tr>

 <font size="5"></font>
  </td>
