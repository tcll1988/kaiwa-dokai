<div align="center">
  <p><font size="+2">“已经……了”の使い方 </font> </p>
  <p><br />
  </p>
</div>
<table width="800" align="center">
  <tr>
    <td align="left">　中国語の“已经……了”は日本語の「もうすでに～」という意味で ある。その否定表現は“还没有……”か、“还没……”という形を取る。 たとえば、 
       <br />
          <br />
    </td>
  </tr>
  <tr>
    <td align="left">
    <font size="4" face="sinsun">已经到秋天了。 </font>
    <font size="3" face="sinsun">Yǐjīng dào qiūtiān le. </font>
   <font size="3" face="mincho">もうすでに秋になった。 </font></td>
  </tr>
  <tr>
    <td>
    <font size="4" face="sinsun">还没有到秋天。</font>
      　<font size="3" face="sinsun">Hái méiyǒu dào qiūtiān.</font>
      　 <font size="3" face="mincho">まだ秋になっていない。</font> </td>
  </tr>
  <tr height="5"></tr>
  <tr>
    <td>
    <font size="4" face="sinsun">他已经吃晚饭了。</font>
      <font size="3" face="sinsun">Tā yǐjīng chī wǎnfàn le. </font>　
    <font size="3" face="mincho">彼はすでに晩ご飯を食べた。 </font></td>
  </tr>
  <tr>
    <td>
    <font size="4" face="sinsun">他还没吃晚饭。 </font>
      <font size="3" face="sinsun">Tā hái méi chī wǎnfàn.</font>
       <font size="3" face="mincho">彼はまだ晩ご飯を食べていない。 </font></td>
  </tr>
