    <td align="left">　中国語の“動詞＋着”は動詞を修飾するものである。この場合、動 作を行うときの状態や方法を表すことになる。たとえば、 
       <br />
          <br />
    </td>

    <td align="left">
    <font size="4" face="sinsun">坐着吃饭。</font>

　   <font size="3" face="mincho">座ってご飯を食べる。</font></td>
  </tr>
  <tr>
    <td>
    <font size="4" face="sinsun">老师站着讲课。</font>
      　<font size="3" face="sinsun">Lǎoshī zhànzhe jiǎng kè.</font>
