 <td colspan="5" width="300"> <font size="5" face="simsun">　佐藤今天没来上课，他感冒了。前天他开始咳嗽，嗓子疼，还有点儿发烧。但昨天上午他来上课了，也没迟到。昨天来学校后，他咳嗽得厉害，所以中午他就走了。昨天他只上了两节课，下午的两节课他没上。昨天下午，他去医院看病了，大夫说他感冒了，让他在家好好儿休息。明天是星期六，我想去佐藤家看看他，告诉他今天四节课都学习了什么。</font>  </td>
 </tr>
  <tr>
  <td width="47">
 <font size="5"></font>
  </td>
  <td colspan="4"> <font size="5">佐藤病了几天了？</font>  </td>
  </tr>
  <tr>
  <td>A</td>
  <td width="178"><font face="SimSun" size="5">一天了</font></td>

    </tr>

  <td><font face="SimSun" size="5">三天了</font></td>
  <td>D</td>
  <td><font face="SimSun" size="5">四天了</font></td>
