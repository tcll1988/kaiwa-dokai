<div align="center">
  <p><font size="+2"><strong>“要……”の使い方</strong></font> </p>
  <p><br />
  </p>
</div>
<table width="750" align="center">
  <tr>
    <td align="left">　ここの“要……”は日本語の「～しなければならない」という意味や｢～すべきだ｣という意味に相当する。“要”の前に“一定”を入れると語気をさらに強調することができる。たとえば、  
 </td>
  </tr>
  <tr height="5"></tr>
 
  <tr>
    <td align="left">
      <font size="4" face="sinsun">要注意休息。 </font>
      <font size="3" face="sinsun">Yào zhùyì xiūxi. </font>
      <font size="3" face="mincho">休むように注意しなければならない。 </font></td>
  </tr>
  <tr>
    <td align="left">
      <font size="4" face="sinsun">下次我一定要去。 </font>
      <font size="3" face="sinsun">Xià cì wǒ yídìng yào qù. </font>      
      <font size="3" face="mincho">次回は必ず行かなければならない。 </font></td>
  </tr>
  <tr>
    <td align="left">
      <font size="4" face="sinsun">明天你一定要来。 </font>
      <font size="3" face="sinsun">Míngtiān nǐ yídìng yào lái. </font>
      <font size="3" face="mincho">明日、きみは必ず来なければならない。 </font></td>
  </tr>
