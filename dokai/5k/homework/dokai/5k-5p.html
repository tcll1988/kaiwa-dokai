  <p><font size="+2"><strong>時間の言い方</strong></font> </p>
  <p><br />
  </p>

<table width="750" align="center">
  <tr>
    <td align="left">　第４課で時刻の言い方を説明したが、この課では、時間の言い方を説明する。中国語では、時間を言うとき、下記のような言い方をする。たとえば、
 </td>
  </tr>
  <tr height="5"></tr>
 
  <tr>
    <td align="left">
      <font size="4" face="sinsun">一个小时</font>
      <font size="3" face="sinsun">yí gè xiǎoshí</font>
      <font size="3" face="mincho">１時間</font></td>
  </tr>
  <tr>
    <td align="left">
      <font size="4" face="sinsun">两个小时</font>
      <font size="3" face="sinsun">liǎng gè xiǎoshí</font>
      <font size="3" face="mincho">２時間</font></td>
  </tr>
  <tr>
    <td align="left">
      <font size="4" face="sinsun">一个半小时</font>
      <font size="3" face="sinsun">yí gè bàn xiǎoshí</font>
      <font size="3" face="mincho">１時間半</font></td>
  </tr>
   <tr>
    <td align="left">
      <font size="4" face="sinsun">一个星期</font>
      <font size="3" face="sinsun">yí gè xīngqī</font>
      <font size="3" face="mincho">一週間</font></td>
  </tr>
   <tr>
    <td align="left">
      <font size="4" face="sinsun">一个月</font>
      <font size="3" face="sinsun">yí gè yuè</font>
      <font size="3" face="mincho">一ヶ月</font></td>
  </tr>
   <tr>
    <td align="left">
      <font size="4" face="sinsun">一年</font>
      <font size="3" face="sinsun">yì nián</font>
      <font size="3" face="mincho">一年間</font></td>
  </tr>
